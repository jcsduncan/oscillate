# Weekly dependency updates. The github-actions ecosystem does not track the
# workflows' container images: ci-image.yml pins the CI image, and the clean
# ubuntu:26.04 of the install smoke tests is bumped by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Every requirements file under scripts/: qa-requirements.txt (clang-format,
  # clang-tidy, gcovr) and ci/{docs,lint}-requirements.txt. One entry, because
  # Dependabot scans subdirectories and a second entry for scripts/ci opens
  # duplicate pull requests.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-tools:
        patterns: ["*"]

  # The CI image's base, scripts/ci/Dockerfile's ubuntu:26.04 digest. The
  # release stays 26.04 until the project moves.
  - package-ecosystem: docker
    directory: /scripts/ci
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: ci
