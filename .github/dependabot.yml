# Weekly dependency updates. There is no Dockerfile: the ubuntu:26.04
# container image named in the workflows is not tracked by the
# github-actions ecosystem, so bump it by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Every requirements file under scripts/: qa-requirements.txt (clang-format,
  # clang-tidy, gcovr) and ci/{docs,lint,coverage}-requirements.txt (hash-pinned). One entry, because
  # Dependabot scans subdirectories and a second entry for scripts/ci opens
  # duplicate pull requests.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-tools:
        patterns: ["*"]
