name: Tidy

on:
  pull_request:
    branches: [main]

concurrency:
  group: tidy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/ci/changes.py "$BASE_SHA" "$HEAD_SHA"

  # The configured .clang-tidy checks on the translation units this change
  # touches (scripts/ci/tidy_changed.py). Advisory: not a required check.
  tidy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: clang-tidy (changed files)
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # 26.04
    timeout-minutes: 60
    steps:
      - name: Install Git for checkout and the diff
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies and the pinned clang-tidy
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/ci/install-deps.sh
          python3 -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --quiet -r scripts/qa-requirements.txt
          echo "$RUNNER_TEMP/qa/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset quick
      # The checkout is GitHub's merge of the pull request into the current
      # base tip, so its first parent is that tip: diffing against it judges
      # the change only on its own lines, even after the base moves on.
      - name: clang-tidy on the changed translation units
        run: python3 -I scripts/ci/tidy_changed.py quick HEAD^1
