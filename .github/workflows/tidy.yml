name: Tidy

on:
  pull_request:
    branches: [main]

concurrency:
  group: tidy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/ci/changes.py "$BASE_SHA" "$HEAD_SHA"

  # The configured .clang-tidy checks on the translation units this change
  # touches (scripts/ci/tidy_changed.py). Advisory: not a required check.
  tidy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: clang-tidy (changed files)
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:21fcc1dfeb84aeec44c07f0e1716477ade8e701ab433dc274e0226ef80bab7a4 # base
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependencies from the CI image and the pinned clang-tidy
        run: |
          scripts/ci/ci-image-deps.sh base
          python3 -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --quiet -r scripts/qa-requirements.txt
          echo "$RUNNER_TEMP/qa/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset quick
      # The checkout is GitHub's merge of the pull request into the current
      # base tip, so its first parent is that tip: diffing against it judges
      # the change only on its own lines, even after the base moves on.
      - name: clang-tidy on the changed translation units
        run: python3 -I scripts/ci/tidy_changed.py quick HEAD^1
