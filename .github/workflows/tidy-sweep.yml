name: Tidy sweep

# The configured .clang-tidy checks over the whole tree, nightly and on demand.
# Advisory, like the pull request Tidy job: not a required check.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# One sweep per branch at a time; a new dispatch waits for the running one.
concurrency:
  group: tidy-sweep-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHARD_COUNT: 8

defaults:
  run:
    shell: bash

jobs:
  tidy:
    name: clang-tidy (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:84224d169333d62e0966dc70e1d86a1c27502ecbe83b549a549d9681a9195762 # full
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # One clang-tidy process per translation unit; eight runners share the tree.
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The optional features too, so every configured variant is checked.
      - name: Dependencies from the CI image and the pinned clang-tidy
        run: |
          scripts/ci/ci-image-deps.sh full
          python3 -m venv "$RUNNER_TEMP/qa"
          "$RUNNER_TEMP/qa/bin/pip" install --quiet -r scripts/qa-requirements.txt
          echo "$RUNNER_TEMP/qa/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned VST3 SDK
        run: scripts/ci/fetch-vst3-sdk.sh "$RUNNER_TEMP/vst3sdk"
      - name: Configure
        run: >-
          cmake --preset quick
          -DOSCILLATE_BUILD_VST3_SCANNER=ON
          -DOSCILLATE_VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
          -DOSCILLATE_BUILD_CODEC_ADAPTER=ON
          -DOSCILLATE_BUILD_EXPORT_RESAMPLER=ON
          -DOSCILLATE_BUILD_SOURCE_RESAMPLER=ON
      # A header's finding repeats for every source that includes it, so the
      # shard also keeps each distinct finding once.
      - name: clang-tidy on this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 -I scripts/ci/tidy_shard.py quick "$SHARD" "$SHARD_COUNT" "findings/shard-$SHARD.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tidy-findings-${{ matrix.shard }}
          path: findings/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    needs: tidy
    if: ${{ !cancelled() }}
    name: Findings across the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tidy-findings-*
          path: findings
          merge-multiple: true
      - name: Distinct findings by check
        run: |
          shards=()
          missing=()
          for ((shard = 0; shard < SHARD_COUNT; shard++)); do
            if [[ -f "findings/shard-$shard.txt" ]]; then
              shards+=("findings/shard-$shard.txt")
            else
              missing+=("$shard")
            fi
          done
          cat "${shards[@]}" /dev/null | sort -u > tidy-findings.txt
          {
            if ((${#missing[@]} > 0)); then
              echo "Partial: shard(s) ${missing[*]} of $SHARD_COUNT uploaded no findings; see their clang-tidy jobs."
              echo
              echo "$(wc -l < tidy-findings.txt) distinct clang-tidy finding(s) in the other shards."
            else
              echo "$(wc -l < tidy-findings.txt) distinct clang-tidy finding(s) across the tree."
            fi
            echo
            echo '| Findings | Check |'
            echo '| ---: | --- |'
            # No findings at all is a clean tree, not a failed step.
            { grep -oE '\[[a-z0-9.-]+(,-warnings-as-errors)?\]$' tidy-findings.txt || true; } \
              | sed -E 's/^\[|(,-warnings-as-errors)?\]$//g' | sort | uniq -c | sort -rn \
              | awk '{ printf "| %s | `%s` |\n", $1, $2 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ((${#missing[@]} == 0))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tidy-findings
          path: tidy-findings.txt
          retention-days: 14
