name: Live tier

# The live test tier (scripts/live-tier.sh) on virtual devices: a PipeWire
# daemon with WirePlumber and disposable null sinks, and an isolated JACK
# dummy server. Physical outputs are qualified on the reference machine
# (docs/qualification/live-tier.md). Weekly on main, on demand, and on pull
# requests that change the live harness.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/live-tier.yml
      - scripts/live-tier.sh

concurrency:
  group: live-tier-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  live:
    name: Live tier (virtual devices)
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # 26.04
    timeout-minutes: 120
    env:
      BUILD_DIR: build/release
      CCACHE_MAXSIZE: 1G
      OSCILLATE_BUILD_JOBS: 4
    steps:
      - name: Install Git for checkout and the VST3 SDK
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies and the audio servers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/ci/install-deps.sh ccache libjack-jackd2-dev jackd2 pipewire pipewire-bin \
            wireplumber dbus
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Fetch the pinned VST3 SDK
        run: scripts/ci/fetch-vst3-sdk.sh "$RUNNER_TEMP/vst3sdk"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-live-${{ github.run_id }}
          restore-keys: ccache-live-
      - name: Configure
        run: cmake --preset release -DOSCILLATE_VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
      # A session bus, PipeWire and WirePlumber for this job only.
      - name: Start PipeWire
        run: |
          runtime="$RUNNER_TEMP/runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime/bus" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$runtime" DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime/bus"
          dbus-daemon --session --fork --address="$DBUS_SESSION_BUS_ADDRESS"
          nohup pipewire > "$RUNNER_TEMP/pipewire.log" 2>&1 &
          sleep 2
          nohup wireplumber > "$RUNNER_TEMP/wireplumber.log" 2>&1 &
          sleep 3
          pw-cli info 0 | head -n 5
      - name: Live tier
        run: scripts/live-tier.sh "$BUILD_DIR" live-tier
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: .ccache
          key: ccache-live-${{ github.run_id }}
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat live-tier/summary.txt 2>/dev/null || echo "no summary"
            echo '```'
            cat live-tier/reference/results.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP"/pipewire.log "$RUNNER_TEMP"/wireplumber.log live-tier/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-tier
          path: live-tier/
          if-no-files-found: ignore
          retention-days: 30
