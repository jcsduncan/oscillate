name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Release Please acts with RELEASE_PLEASE_TOKEN, a fine-grained personal
    # access token (CONTRIBUTING.md, "Releases"): a pull request or tag made
    # with this job's own token starts no workflow, so the release pull
    # request would get no CI and the tag no packages. The tag push starts
    # the packaging workflow, which attaches the packages to the release.
    steps:
      - name: Require the release token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::The RELEASE_PLEASE_TOKEN repository secret is not set (CONTRIBUTING.md, \"Releases\")"
            exit 1
          fi
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
