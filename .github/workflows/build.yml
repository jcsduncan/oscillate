name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: build/quick

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/ci/changes.py "$BASE_SHA" "${HEAD_SHA:-HEAD}"

  # Builds once; the test shards below run from this build tree.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build (Ubuntu 26.04, Qt Quick)
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:21fcc1dfeb84aeec44c07f0e1716477ade8e701ab433dc274e0226ef80bab7a4 # base
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
      OSCILLATE_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies from the CI image
        run: |
          scripts/ci/ci-image-deps.sh base
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-quick-${{ github.sha }}
          restore-keys: ccache-quick-
      # Hosted runners are slower than a desktop, so test budgets get headroom.
      # GCC 15 warnings fail the build.
      - name: Configure
        run: cmake --preset quick -DOSCILLATE_TEST_TIMEOUT_SCALE=3 -DOSCILLATE_WARNINGS_AS_ERRORS=ON
      - name: Build everything and the tests
        run: scripts/build.sh "$BUILD_DIR" --target all oscillate_tests
      # The shards need the binaries, shared libraries, fixtures and CTest
      # files; objects and split debug info stay behind.
      - name: Pack the build tree
        run: |
          tar --zstd -cf build-tree.tar.zst \
            --exclude='*.o' --exclude='*.dwo' \
            --exclude="$BUILD_DIR/scratch" --exclude="$BUILD_DIR/Testing" \
            "$BUILD_DIR"
          ls -lh build-tree.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-tree
          path: build-tree.tar.zst
          compression-level: 0
          retention-days: 1
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true

  # Every tier but live, in shards of about equal measured time
  # (scripts/ci/ctest_shards.py), plus the live/export parity gate.
  tests:
    needs: build
    name: Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:21fcc1dfeb84aeec44c07f0e1716477ade8e701ab433dc274e0226ef80bab7a4 # base
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", parity]
    env:
      SHARD_COUNT: 4
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies from the CI image
        run: scripts/ci/ci-image-deps.sh base
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-tree
      # TMPDIR stays the container's /tmp: the analysis cache tests refuse a
      # fixture path under the runner-owned workspace.
      - name: Unpack the build tree
        run: |
          tar --zstd -xf build-tree.tar.zst
          rm build-tree.tar.zst
          mkdir -p "results/tests-${{ matrix.shard }}"
          echo "JUNIT=$GITHUB_WORKSPACE/results/tests-${{ matrix.shard }}/junit.xml" >> "$GITHUB_ENV"
      # The parity gate fails if its label selects no test (tests/README.md).
      - name: Live/export parity
        if: matrix.shard == 'parity'
        run: ctest --preset quick-parity -j4 --output-junit "$JUNIT"
      - name: Tests, shard ${{ matrix.shard }} of ${{ env.SHARD_COUNT }} (no live devices)
        if: matrix.shard != 'parity'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 -I scripts/ci/ctest_shards.py "$BUILD_DIR" "$SHARD_COUNT" "$RUNNER_TEMP/shards"
          ctest --preset quick --tests-from-file "$RUNNER_TEMP/shards/shard-$SHARD.txt" \
            --no-tests=error -j4 --output-junit "$JUNIT"
      - name: Keep the failing tests' logs
        if: failure()
        run: cp "$BUILD_DIR"/Testing/Temporary/LastTest*.log "results/tests-${{ matrix.shard }}/" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.shard }}
          path: results/tests-${{ matrix.shard }}/
          if-no-files-found: ignore
          retention-days: 7

  # The required check: passes only when the build and every shard passed,
  # and is skipped (which satisfies it) when only docs changed. Named for
  # the branch ruleset, which requires this name.
  build-test:
    needs: [changes, build, tests]
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    name: Build and fast tests (Ubuntu 26.04, Qt Quick)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with:
          pattern: tests-*
          path: results
      - name: Failing tests
        if: needs.build.result == 'success'
        run: |
          python3 -I scripts/ci/ctest_failures.py results/tests-{1,2,3,4,parity}/junit.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "Quarantined, not run here (scripts/ci/quarantine.txt):"
            grep -vE '^(#|$)' scripts/ci/quarantine.txt | awk '{ printf "- `%s` (#%s)\n", $1, $2 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Every job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "changed paths: $CHANGES, build: $BUILD, tests: $TESTS"
          [ "$CHANGES" = success ] && [ "$BUILD" = success ] && [ "$TESTS" = success ]
