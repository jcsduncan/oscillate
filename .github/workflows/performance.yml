name: Reference performance

# The light and heavy reference projects (docs/performance/reference-projects.md)
# at 64 and 128 frames through the paced fake callback: callback p50/p99/max,
# whole-process CPU and a per-device table from the performance trace. Hosted
# runners are shared machines, so these numbers track trends; release figures
# come from the reference machine. The master gate (ADR-0125) plays a
# finished master's chain and fails when its serial time or the callback's
# p99 passes its limit. Weekly on main, on demand, and on pull requests that
# change the harness, the built-in effects' DSP or the engine.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Measured seconds per run
        required: false
        default: "20"
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/performance.yml
      - tests/qualification/qualify_reference_projects.py
      - tests/qualification/reference_project.cpp
      - tests/qualification/CMakeLists.txt
      - src/native_dsp/effects/**
      - src/native_dsp/dsp/**
      - src/engine/**
      - src/audio_io/**
      - include/oscillate/audio_io/**
      - src/track_chain/**
      - src/application/routed_audio_source.cpp

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  reference:
    name: Reference projects (fake callback)
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:21fcc1dfeb84aeec44c07f0e1716477ade8e701ab433dc274e0226ef80bab7a4 # base
    timeout-minutes: 120
    env:
      BUILD_DIR: build/release
      CCACHE_MAXSIZE: 1G
      OSCILLATE_BUILD_JOBS: 4
      SECONDS_PER_RUN: ${{ inputs.seconds || '20' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          scripts/ci/ci-image-deps.sh base
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Fetch the pinned VST3 SDK
        run: scripts/ci/fetch-vst3-sdk.sh "$RUNNER_TEMP/vst3sdk"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-performance-${{ github.run_id }}
          restore-keys: ccache-performance-
      # The release preset, as on the reference machine, with the qualification
      # programs added to the main build.
      - name: Configure
        run: >-
          cmake --preset release
          -DBUILD_TESTING=OFF
          -DOSCILLATE_BUILD_QUALIFICATION=ON
          -DOSCILLATE_BUILD_VST3_SCANNER=ON
          -DOSCILLATE_VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
      - name: Build the reference project player
        run: scripts/build.sh "$BUILD_DIR" --target oscillate_reference_project
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: .ccache
          key: ccache-performance-${{ github.run_id }}
      - name: Measure
        run: |
          python3 -I tests/qualification/qualify_reference_projects.py \
            --executable "$BUILD_DIR/tests/qualification/oscillate_reference_project" \
            --output performance --seconds "$SECONDS_PER_RUN" --trace
          cat performance/results.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reference-performance
          path: |
            performance/results.*
            performance/log-*.txt
          if-no-files-found: ignore
          retention-days: 90

  master:
    name: Master chain gate (fake callback)
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:21fcc1dfeb84aeec44c07f0e1716477ade8e701ab433dc274e0226ef80bab7a4 # base
    timeout-minutes: 120
    env:
      BUILD_DIR: build/release
      CCACHE_MAXSIZE: 1G
      OSCILLATE_BUILD_JOBS: 4
      SECONDS_PER_RUN: ${{ inputs.seconds || '20' }}
      # The master's mean serial time and the callback's p99, as shares of
      # the block period, for the light reference with the heavy master at
      # 1024 frames: about 30% over what hosted runners measure (master
      # 6.9-7.7%, p99 9.9%), under what the master cost before the realtime
      # FFT (9.5%, ADR-0126).
      MASTER_LIMIT_PERCENT: 10
      P99_LIMIT_PERCENT: 15
      # Those two are measured in whole blocks (--subblocks off), so they gate
      # the master's own cost. In parts (ADR-0127) the master costs more but
      # mostly overlaps the tracks: its time alone after the other nodes, 3.6
      # to 3.8% here at 512 and 1024 frames against 6.9-7.7% whole, is gated
      # with the callback's p99 as playback runs.
      EXPOSED_LIMIT_PERCENT: 5
      # Render-ahead's spike gate: the window, the spike and how often it
      # comes, and the late blocks allowed for a shared runner's preemption.
      AHEAD_MS: 50
      SPIKE_US: 25000
      SPIKE_EVERY_BLOCKS: 100
      LATE_BLOCK_LIMIT: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          scripts/ci/ci-image-deps.sh base
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Fetch the pinned VST3 SDK
        run: scripts/ci/fetch-vst3-sdk.sh "$RUNNER_TEMP/vst3sdk"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-performance-${{ github.run_id }}
          restore-keys: ccache-performance-
      - name: Configure
        run: >-
          cmake --preset release
          -DBUILD_TESTING=OFF
          -DOSCILLATE_BUILD_QUALIFICATION=ON
          -DOSCILLATE_BUILD_VST3_SCANNER=ON
          -DOSCILLATE_VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
      - name: Build the reference project player
        run: scripts/build.sh "$BUILD_DIR" --target oscillate_reference_project
      # The light reference's tracks leave most of each block to the master,
      # so its serial cost shows plainly; on these four-core runners the
      # heavy reference's p99 is set mostly by its tracks, so it is
      # reported, not gated.
      - name: Gate the master
        run: |
          status=0
          python3 -I tests/qualification/qualify_reference_projects.py \
            --executable "$BUILD_DIR/tests/qualification/oscillate_reference_project" \
            --output master-gate --references light --master heavy --frames 1024 \
            --seconds "$SECONDS_PER_RUN" --trace --subblocks off \
            --gate-master-percent "$MASTER_LIMIT_PERCENT" --gate-p99-percent "$P99_LIMIT_PERCENT" \
            || status=$?
          if [ -f master-gate/results.md ]; then
            cat master-gate/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - name: Gate the master's overlap with the tracks
        if: always()
        run: |
          status=0
          python3 -I tests/qualification/qualify_reference_projects.py \
            --executable "$BUILD_DIR/tests/qualification/oscillate_reference_project" \
            --output master-overlap --references light --master heavy --frames 1024 \
            --seconds "$SECONDS_PER_RUN" --trace \
            --gate-exposed-percent "$EXPOSED_LIMIT_PERCENT" --gate-p99-percent "$P99_LIMIT_PERCENT" \
            || status=$?
          if [ -f master-overlap/results.md ]; then
            cat master-overlap/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      # Every buffer, light and heavy: the master's share is gated, the
      # callback's p99 only reported.
      - name: Gate the master's share at each buffer
        if: always()
        run: |
          status=0
          python3 -I tests/qualification/qualify_reference_projects.py \
            --executable "$BUILD_DIR/tests/qualification/oscillate_reference_project" \
            --output master-heavy --references light heavy --master heavy \
            --frames 256 512 1024 --seconds "$SECONDS_PER_RUN" --trace --subblocks off \
            --gate-master-percent "$MASTER_LIMIT_PERCENT" || status=$?
          if [ -f master-heavy/results.md ]; then
            cat master-heavy/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      # Render-ahead (ADR-0128): with a 50 ms window, a render 25 ms slow
      # every 100 blocks reaches the callback only if the window fails.
      - name: Gate render-ahead under load spikes
        if: always()
        run: |
          status=0
          python3 -I tests/qualification/qualify_reference_projects.py \
            --executable "$BUILD_DIR/tests/qualification/oscillate_reference_project" \
            --output render-ahead --references light --master heavy --frames 256 1024 \
            --seconds "$SECONDS_PER_RUN" --ahead-ms "$AHEAD_MS" \
            --spike-every "$SPIKE_EVERY_BLOCKS" --spike-us "$SPIKE_US" \
            --gate-late-blocks "$LATE_BLOCK_LIMIT" || status=$?
          if [ -f render-ahead/results.md ]; then
            cat render-ahead/results.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: master-gate
          path: |
            master-gate/results.*
            master-gate/log-*.txt
            master-overlap/results.*
            master-overlap/log-*.txt
            master-heavy/results.*
            master-heavy/log-*.txt
            render-ahead/results.*
            render-ahead/log-*.txt
          if-no-files-found: ignore
          retention-days: 90
