name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -I scripts/ci/changes.py "$BASE_SHA" "${HEAD_SHA:-HEAD}"

  # Skipped when no Python file or Python CI input changed.
  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python unit tests
    runs-on: ubuntu-latest
    container: ghcr.io/jcsduncan/oscillate-ci@sha256:84224d169333d62e0966dc70e1d86a1c27502ecbe83b549a549d9681a9195762 # full
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies from the CI image
        run: scripts/ci/ci-image-deps.sh full
      - name: Run suites
        run: scripts/ci/python-tests.sh
