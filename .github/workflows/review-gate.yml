name: Review gate

# Sets the required "Review gate" commit status on pull request heads
# (scripts/ci/review_gate.py, CONTRIBUTING.md "Merging"). Auto-merge waits
# for it. The job runs no pull request code with its token: the comment,
# check run and schedule events run the default branch's workflow and
# script, and the pull request events run only for branches of this
# repository, whose workflow file already comes from the pull request.
# Resolving a review thread fires no event, so the schedule re-evaluates
# every open pull request.

on:
  check_run:
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
  pull_request_review_comment:
  issue_comment:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions: {} # the job asks for what it needs

jobs:
  gate:
    name: Evaluate the review gate
    # A fork's pull request events get a read-only token; the schedule sets
    # the status on those. Check runs matter only from CodeRabbit, or on a
    # Release Please branch, whose gate waits for every check.
    if: >-
      (github.event_name != 'pull_request' &&
       github.event_name != 'pull_request_review' &&
       github.event_name != 'pull_request_review_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'check_run' ||
       github.event.check_run.app.slug == 'coderabbitai' ||
       startsWith(github.event.check_run.check_suite.head_branch, 'release-please--'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      statuses: write # the Review gate status
      checks: read # CodeRabbit's and the other check runs
      contents: read # the gate script
      pull-requests: read # pull requests, their commits and review threads
      issues: read # CodeRabbit's rate-limit and paused notices
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/review_gate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set the Review gate status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/review_gate.py --event "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH"
