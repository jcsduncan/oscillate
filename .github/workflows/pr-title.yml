name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: PR title (Conventional Commits with scope)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The title is passed through the environment, never interpolated into
      # the script, so a title can't inject shell.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: python3 -I scripts/ci/check_pr_title.py "$TITLE"
