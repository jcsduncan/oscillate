name: VST3 matrix

# The VST3 compatibility matrix (docs/qualification/vst3-compatibility-matrix.md):
# scan, load, render, state, editor, save/reopen and export for each class of
# a pinned set of free Linux plug-ins. Weekly on main, on demand, and on pull
# requests that change the matrix itself. Plug-in failures are evidence in
# the matrix, not a failed run; only a harness error fails it.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/vst3-matrix.yml
      - tests/qualification/qualify_vst3_matrix.py
      - tests/qualification/vst3_matrix_plugins.json
      - tests/qualification/vst3_matrix_probe.cpp

concurrency:
  group: vst3-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  matrix:
    name: VST3 compatibility matrix
    runs-on: ubuntu-latest
    container: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # 26.04
    timeout-minutes: 180
    env:
      BUILD_DIR: build/qualification
      CCACHE_MAXSIZE: 1G
      OSCILLATE_BUILD_JOBS: 4
    steps:
      - name: Install Git for checkout and the VST3 SDK
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build dependencies, an X server for the editors, and the libraries the
      # plug-ins themselves load (JUCE, DPF, LSP and Cardinal runtimes).
      - name: Install dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/ci/install-deps.sh ccache libx11-dev qt6-qpa-plugins libxcb-cursor0 \
            xvfb xauth 7zip libfreetype6 libfontconfig1 libxext6 libxrandr2 libxinerama1 \
            libxcursor1 libasound2t64 libgl1 libglx-mesa0 libcairo2 libcurl4t64 \
            libgtk-3-0t64 libsndfile1 libjack-jackd2-0
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
      - name: Fetch the pinned VST3 SDK
        run: scripts/ci/fetch-vst3-sdk.sh "$RUNNER_TEMP/vst3sdk"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-qualification-${{ github.run_id }}
          restore-keys: ccache-qualification-
      # The archives are pinned by SHA-256, so the manifest's hash names them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vst3-matrix/downloads
          key: vst3-matrix-${{ hashFiles('tests/qualification/vst3_matrix_plugins.json') }}
      - name: Configure
        run: >-
          cmake -S tests/qualification -B "$BUILD_DIR" -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOSCILLATE_BUILD_QUICK_UI=ON
          -DOSCILLATE_BUILD_VST3_SCANNER=ON
          -DOSCILLATE_VST3_SDK_ROOT="$RUNNER_TEMP/vst3sdk"
      - name: Build the probe
        run: scripts/build.sh "$BUILD_DIR" --target oscillate_vst3_matrix_probe
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: .ccache
          key: ccache-qualification-${{ github.run_id }}
      - name: Qualify every pinned plug-in
        env:
          QT_QPA_PLATFORM: xcb
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            python3 -I tests/qualification/qualify_vst3_matrix.py \
              --probe "$BUILD_DIR/oscillate_vst3_matrix_probe" \
              --work vst3-matrix --output vst3-matrix/result --editor
          cat vst3-matrix/result/matrix.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && github.event_name != 'pull_request'
        with:
          path: vst3-matrix/downloads
          key: vst3-matrix-${{ hashFiles('tests/qualification/vst3_matrix_plugins.json') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vst3-matrix
          path: vst3-matrix/result/
          if-no-files-found: ignore
          retention-days: 90
