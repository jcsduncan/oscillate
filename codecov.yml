# Codecov settings. CI uploads the core `coverage` preset report (src/ and
# include/, see scripts/ci/coverage.sh) with OIDC; there is no upload token.
# The hard floor is enforced in CI by scripts/check-coverage.sh
# (--fail-under-line 90; 90.81% measured, docs/quality/full-coverage-baseline.md).
# Keep `target` below in step with that floor.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...95"
  status:
    project:
      default:
        target: 90%
        threshold: 0.5%
        flags: [core]
    patch:
      default:
        target: 90%
        informational: true

flags:
  core:
    paths:
      - src/
      - include/
    carryforward: false

ignore:
  - third_party/**
  - tests/**
  - bench/**
  - tools/**

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  require_changes: true
